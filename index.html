<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Risk Category Analytics Explorer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: sticky top bar with breadcrumb + search; left system map; main view. Home = executive diagram as a clickable grid. */
:root {
  --bg: #F6F7F9; --surface: #FFFFFF; --sunk: #EEF1F5; --line: #D8DEE6;
  --ink: #17233A; --muted: #56647A; --faint: #8693A6;
  --navy: #1F3864; --navy-ink: #FFFFFF; --navy-soft: #E6ECF6;
  --teal: #0E7C7B; --teal-soft: #E1F1F0;
  --green: #2E7D32; --green-soft: #E7F3E7;
  --amber: #B95A0C; --amber-soft: #FBEEDF;
  --focus: #2F6FDB;
  --display: "Barlow Semi Condensed", "Arial Narrow", "Segoe UI", sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1520; --surface: #161E2C; --sunk: #1C2636; --line: #2A3649;
  --ink: #E7ECF4; --muted: #A3B0C3; --faint: #75839A;
  --navy: #2C4E8A; --navy-ink: #FFFFFF; --navy-soft: #1D2A42;
  --teal: #1F9A98; --teal-soft: #14302F;
  --green: #45A04A; --green-soft: #18301A;
  --amber: #E08A3C; --amber-soft: #33240F;
  --focus: #7FA8F0; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0F1520; --surface: #161E2C; --sunk: #1C2636; --line: #2A3649;
  --ink: #E7ECF4; --muted: #A3B0C3; --faint: #75839A;
  --navy: #2C4E8A; --navy-ink: #FFFFFF; --navy-soft: #1D2A42;
  --teal: #1F9A98; --teal-soft: #14302F;
  --green: #45A04A; --green-soft: #18301A;
  --amber: #E08A3C; --amber-soft: #33240F;
  --focus: #7FA8F0; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar-in { max-width: 1320px; margin: 0 auto; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.brand { font-family: var(--display); font-weight: 700; font-size: 17px; letter-spacing: .02em; color: var(--navy); text-decoration: none; white-space: nowrap; }
:root[data-theme="dark"] .brand { color: var(--ink); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .brand { color: var(--ink); } }
.crumbs { flex: 1 1 320px; min-width: 0; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 13.5px; color: var(--muted); }
.crumbs a { text-decoration: none; padding: 2px 6px; border-radius: 6px; }
.crumbs a:hover { background: var(--sunk); color: var(--ink); }
.crumbs .sep { color: var(--faint); }
.crumbs .cur { color: var(--ink); font-weight: 600; padding: 2px 6px; }
.search { position: relative; flex: 0 1 300px; min-width: 200px; }
.search input { width: 100%; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font: inherit; font-size: 14px; }
.results { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 30px rgba(0,0,0,.14); max-height: 60vh; overflow: auto; padding: 6px; }
.results a { display: block; padding: 8px 10px; border-radius: 8px; text-decoration: none; }
.results a:hover, .results a.on { background: var(--sunk); }
.results small { color: var(--muted); display: block; font-size: 12px; }
.mapbtn { display: none; border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; }

/* frame */
.wrap { max-width: 1320px; margin: 0 auto; display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 24px;
  padding-block: 22px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
nav.tree { position: sticky; top: 76px; align-self: start; max-height: calc(100vh - 96px); overflow: auto; font-size: 13.5px; padding-right: 4px; }
.tree h3 { font-family: var(--display); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); margin: 4px 0 8px; }
.tree ul { list-style: none; margin: 0; padding-left: 12px; border-left: 1px solid var(--line); }
.tree > ul { padding-left: 0; border: 0; }
.tree li { margin: 1px 0; }
.tree a { display: block; padding: 3px 8px; border-radius: 6px; text-decoration: none; color: var(--muted); }
.tree a:hover { background: var(--sunk); color: var(--ink); }
.tree a.on { background: var(--navy); color: var(--navy-ink); font-weight: 600; }
.tree a.anc { color: var(--ink); font-weight: 600; }
main { min-width: 0; }

/* node header */
.eyebrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-family: var(--display); font-weight: 600; font-size: 12.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.lvl { font-family: var(--mono); font-size: 11.5px; letter-spacing: 0; padding: 2px 7px; border-radius: 99px; background: var(--sunk); color: var(--muted); text-transform: none; }
.code { font-family: var(--mono); font-size: 12px; letter-spacing: 0; padding: 2px 7px; border-radius: 6px; background: var(--navy-soft); color: var(--navy); text-transform: none; }
:root[data-theme="dark"] .code { color: var(--ink); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .code { color: var(--ink); } }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(26px, 3.4vw, 38px); line-height: 1.1; margin: 8px 0 8px; text-wrap: balance; }
.lede { font-size: 17px; color: var(--muted); max-width: 70ch; margin: 0 0 18px; }
.hint { font-size: 13px; color: var(--faint); }

section.blk { margin-top: 26px; }
section.blk > h2 { font-family: var(--display); font-weight: 700; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; display: flex; gap: 8px; align-items: baseline; }
section.blk > h2 span { font-family: var(--body); text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--faint); font-size: 13px; }

/* facts */
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.fact { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px; min-width: 0; }
.fact dt { font-size: 12px; color: var(--faint); text-transform: uppercase; letter-spacing: .08em; font-family: var(--display); font-weight: 600; }
.fact dd { margin: 2px 0 0; font-weight: 500; }

/* drill cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
a.card { display: flex; flex-direction: column; gap: 6px; text-decoration: none; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; min-width: 0; transition: border-color .15s, transform .15s, box-shadow .15s; }
a.card:hover { border-color: var(--navy); box-shadow: 0 6px 18px rgba(23,35,58,.09); transform: translateY(-1px); }
.card .k { font-family: var(--display); font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); display: flex; justify-content: space-between; gap: 8px; }
.card .t { font-family: var(--display); font-weight: 700; font-size: 18px; line-height: 1.2; }
.card .s { color: var(--muted); font-size: 14px; }
.card .more { margin-top: auto; font-size: 13px; color: var(--navy); font-weight: 600; }
:root[data-theme="dark"] .card .more { color: var(--focus); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .card .more { color: var(--focus); } }
.card.ai { border-top: 3px solid var(--teal); } .card.hu { border-top: 3px solid var(--green); } .card.gv { border-top: 3px solid var(--amber); }

/* tables */
.tbl { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.tbl + .tbl { margin-top: 14px; }
.tbl caption { text-align: left; padding: 10px 14px 0; font-weight: 600; font-family: var(--display); font-size: 15px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; vertical-align: top; padding: 8px 14px; border-bottom: 1px solid var(--line); }
th { font-family: var(--display); font-weight: 600; font-size: 12.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); background: var(--sunk); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td:first-child { font-weight: 600; }
td a.in, .prose a.in { color: var(--navy); font-weight: 600; text-decoration: none; border-bottom: 1px dotted currentColor; }
:root[data-theme="dark"] td a.in, :root[data-theme="dark"] .prose a.in { color: var(--focus); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) td a.in, :root:not([data-theme="light"]) .prose a.in { color: var(--focus); } }
.mono { font-family: var(--mono); font-size: 12.5px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips a { text-decoration: none; border: 1px solid var(--line); background: var(--surface); padding: 5px 11px; border-radius: 99px; font-size: 13.5px; }
.chips a:hover { border-color: var(--navy); }
.chips a .code { margin-right: 6px; }
ul.links { margin: 0; padding-left: 18px; }
ul.links li { margin: 4px 0; }
ul.links a { color: var(--navy); }
:root[data-theme="dark"] ul.links a { color: var(--focus); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) ul.links a { color: var(--focus); } }
.prose { max-width: 75ch; }
.prose p { margin: 0 0 10px; }
.note { border-left: 3px solid var(--amber); background: var(--amber-soft); padding: 10px 14px; border-radius: 0 8px 8px 0; font-size: 14px; max-width: 80ch; }

/* home diagram */
.dia { display: grid; grid-template-columns: minmax(150px, 1fr) minmax(0, 3.6fr) minmax(150px, 1.2fr); gap: 18px; align-items: stretch; margin-top: 8px; }
.col h4, .plat h4, .gov h4 { font-family: var(--display); font-weight: 700; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; margin: 0 0 10px; }
.col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.col.src h4 { color: var(--navy); } .col.out h4 { color: var(--green); }
:root[data-theme="dark"] .col.src h4 { color: var(--focus); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .col.src h4 { color: var(--focus); } }
a.box { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 2px; text-decoration: none; border-radius: var(--r); padding: 14px; min-height: 92px; border: 1.5px solid; transition: transform .15s, box-shadow .15s; position: relative; }
a.box:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(23,35,58,.12); }
a.box b { font-family: var(--display); font-size: 17px; line-height: 1.2; }
a.box span { font-size: 13px; color: var(--muted); }
a.box::after { content: "›"; position: absolute; right: 10px; top: 8px; font-size: 18px; color: var(--faint); }
.src a.box { background: var(--navy-soft); border-color: var(--navy); }
.out a.box { background: var(--green-soft); border-color: var(--green); }
.plat { position: relative; background: var(--surface); border: 2px solid var(--navy); border-radius: 16px; padding: 16px 16px 14px; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.plat-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.plat-head > a { font-family: var(--display); font-weight: 700; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; text-decoration: none; color: var(--navy); }
:root[data-theme="dark"] .plat-head > a { color: var(--focus); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .plat-head > a { color: var(--focus); } }
.plat-head > a:hover { text-decoration: underline; }
.steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 22px; position: relative; }
a.step { text-decoration: none; background: var(--navy); color: var(--navy-ink); border-radius: 12px; padding: 16px 12px 14px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 196px; position: relative; transition: transform .15s, box-shadow .15s; }
a.step:hover { transform: translateY(-2px); box-shadow: 0 10px 22px rgba(23,35,58,.22); }
a.step .n { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: #FFFFFF; color: #1F3864; font-family: var(--display); font-weight: 700; font-size: 18px; }
a.step b { font-family: var(--display); font-size: 21px; line-height: 1.1; margin-top: 4px; }
a.step span { font-size: 13.5px; opacity: .85; }
a.step em { font-style: normal; font-size: 11.5px; font-family: var(--mono); opacity: .75; margin-top: auto; }
a.step.ai { background: var(--teal); }
a.step.hu { background: var(--green-soft); color: var(--ink); border: 2px solid var(--green); }
a.step.hu .n { background: var(--green); color: #FFFFFF; }
a.step + a.step::before { content: ""; position: absolute; left: -19px; top: 50%; width: 16px; height: 2px; background: var(--faint); }
a.step + a.step::after { content: ""; position: absolute; left: -7px; top: calc(50% - 4px); border: 5px solid transparent; border-left: 6px solid var(--faint); }
.loop { display: flex; justify-content: center; }
.loop a { font-size: 13.5px; color: var(--amber); font-style: italic; text-decoration: none; border: 1.5px dashed var(--amber); border-radius: 99px; padding: 5px 14px; background: var(--amber-soft); }
.loop a:hover { font-weight: 600; }
.quick { display: flex; flex-wrap: wrap; gap: 8px; }
.quick a { font-size: 13px; text-decoration: none; border-radius: 99px; padding: 4px 11px; background: var(--sunk); color: var(--ink); }
.quick a:hover { background: var(--navy-soft); }
.gov { margin-top: 18px; }
.gov h4 { color: var(--navy); text-align: center; }
:root[data-theme="dark"] .gov h4 { color: var(--ink); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .gov h4 { color: var(--ink); } }
.govrow { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: var(--navy); border-radius: 12px; overflow: hidden; }
.govrow a { text-decoration: none; color: var(--navy-ink); padding: 16px 12px; text-align: center; border-left: 1px solid rgba(255,255,255,.18); display: flex; flex-direction: column; gap: 2px; transition: background .15s; }
.govrow a:first-child { border-left: 0; }
.govrow a:hover { background: rgba(255,255,255,.1); }
.govrow b { font-family: var(--display); font-size: 16px; }
.govrow span { font-size: 13px; opacity: .85; }
.legend { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 16px; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

@media (max-width: 980px) {
  .wrap { grid-template-columns: minmax(0, 1fr); }
  nav.tree { display: none; position: static; max-height: none; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; }
  nav.tree.open { display: block; }
  .mapbtn { display: inline-block; }
  .dia { grid-template-columns: minmax(0, 1fr); }
  .col { flex-direction: row; flex-wrap: wrap; } .col h4 { flex-basis: 100%; } .col a.box { flex: 1 1 160px; }
}
@media (max-width: 640px) {
  .steps { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  a.step + a.step::before, a.step + a.step::after { display: none; }
  .govrow { grid-template-columns: minmax(0, 1fr); }
  .govrow a { border-left: 0; border-top: 1px solid rgba(255,255,255,.18); }
  .search { flex-basis: 100%; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="bar">
  <div class="bar-in">
    <a class="brand" href="#home">Risk Category Analytics</a>
    <button class="mapbtn" id="mapbtn" type="button" aria-expanded="false">System map</button>
    <div class="crumbs" id="crumbs" aria-label="Breadcrumb"></div>
    <div class="search">
      <input id="q" type="search" placeholder="Search: component, field, rule, ID…" autocomplete="off" aria-label="Search the architecture">
      <div class="results" id="results" hidden></div>
    </div>
  </div>
</header>
<div class="wrap">
  <nav class="tree" id="tree" aria-label="System map"></nav>
  <main id="view" tabindex="-1"></main>
</div>

<script>
/* ===================== CONTENT MODEL =====================
   Sources: US 313487 v2 (inputs and outputs) and US 313488 (architecture).
   Each node: id, p (parent), k (kind), t (title), s (summary), and optional
   code, facts [[label, value]], tables [{cap, cols, rows}], prose [..], rel [ids], links [[text, url]], note, cls.
   In table cells and prose, [[id]] or [[id|text]] becomes an internal link. */
const N = [];
const add = (o) => N.push(o);

/* ---------- Level 0 ---------- */
add({ id: "home", t: "Global Risk Category Analytics", k: "Executive view",
  s: "Turning thousands of safety reports into approved, traceable risk insight for SEWG. Click any box to go deeper." });

/* ---------- Sources ---------- */
add({ id: "src-public", p: "home", k: "Safety data", code: "I-1", t: "Public reports",
  s: "Free government datasets that give the accident and incident history across the industry. Each source has one registered interface.",
  facts: [["Input", "I-1 Safety report sources"], ["Protection", "P0 public"], ["Read by", "Step 1 Collect & clean"], ["Refresh", "Monthly to start"]],
  rel: ["a1", "src-internal", "gov-protect"] });
add({ id: "src-ntsb", p: "src-public", k: "Report source", t: "NTSB accident database",
  s: "Investigated accidents and selected incidents. The primary source for accidents.",
  facts: [["Role", "Primary accident source"], ["Use for rates", "Yes"], ["Refresh", "Monthly"], ["Access", "Free download (avall) or CAROL search"], ["Watch for", "Long narratives; accidents plus some incidents"]],
  links: [["NTSB downloadable aviation datasets", "https://data.ntsb.gov/avdata/"], ["NTSB CAROL", "https://www.ntsb.gov/Pages/CAROL.aspx"]], rel: ["a4"] });
add({ id: "src-aids", p: "src-public", k: "Report source", t: "FAA AIDS",
  s: "FAA incident records. Used for incidents only; accidents come from NTSB so nothing is counted twice.",
  facts: [["Role", "Incidents"], ["Use for rates", "To be confirmed (check current update status)"], ["Refresh", "Per ASIAS release"], ["Format", "Tab-delimited files"]],
  links: [["FAA ASIAS – AIDS / NTSB data info", "https://asip.faa.gov/explore/ntsb/info"]], rel: ["a4"] });
add({ id: "src-asrs", p: "src-public", k: "Report source", t: "NASA ASRS",
  s: "Voluntary, mostly pilot reports. Rich in themes, but counts are a lower bound, not how often events happen.",
  facts: [["Role", "Context and themes"], ["Use for rates", "No – shown as report counts only"], ["Refresh", "Monthly"], ["Limit", "10,000 records per export"]],
  links: [["ASRS – About the data", "https://asrs.arc.nasa.gov/search/dbol/aboutdata.html"]], rel: ["da"] });
add({ id: "src-sdrs", p: "src-public", k: "Report source", t: "FAA SDRS",
  s: "Maintenance defect reports. Useful context for system and component failures; known to be incomplete.",
  facts: [["Role", "Context for system failures"], ["Use for rates", "No"], ["Refresh", "Per release"]],
  links: [["FAA SDRS query", "https://sdrs.faa.gov/Query.aspx"], ["GAO on SDRS data quality", "https://www.gao.gov/assets/rced-91-24.pdf"]] });
add({ id: "src-internal", p: "home", k: "Safety data", code: "I-1", t: "Boeing internal safety reports",
  s: "The main source for the Boeing fleet. Which systems, owners and terms apply is still to be confirmed by the data-source review.",
  facts: [["Role", "Primary for Boeing fleet"], ["Use for rates", "Yes, once coverage is known"], ["Protection", "P1–P3 (internal to voluntary-protected)"], ["Status", "Sources to be named – decision D-4"]],
  note: "Naming these sources with their owner, protection class and data-sharing terms is the main schedule risk. Build starts on public data while agreements land.",
  rel: ["d-4", "gov-protect", "stage-4"] });
add({ id: "src-fleet", p: "home", k: "Safety data", code: "I-4", t: "Fleet activity",
  s: "Departures and flight hours by aircraft model, month and operator region. Turns event counts into rates.",
  facts: [["Boeing models", "Boeing internal utilization data"], ["Other models", "Cirium (licence)"], ["Cross-check", "US BTS T-100 traffic data"], ["Revisions", "Stored as new versions; past rates restated"]],
  links: [["BTS T-100 segment data", "https://www.transtats.bts.gov/DatabaseInfo.asp?QO_VQ=EEE"]],
  rel: ["d-2", "da", "i-4"] });

/* ===================== ENGINE ===================== */
const byId = Object.fromEntries(N.map(n => [n.id, n]));
const kids = {};
N.forEach(n => { if (n.p) (kids[n.p] = kids[n.p] || []).push(n.id); });
const pathTo = (id) => { const out = []; let n = byId[id]; while (n) { out.unshift(n); n = byId[n.p]; } return out; };
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const linkify = (s) => esc(s).replace(/\[\[([a-z0-9-]+)(?:\|([^\]]+))?\]\]/g, (m, id, label) =>
  byId[id] ? `<a class="in" href="#${id}">${label || byId[id].t}</a>` : (label || id));
const plain = (s) => String(s || "").replace(/\[\[([a-z0-9-]+)(?:\|([^\]]+))?\]\]/g, (m, id, l) => l || (byId[id] ? byId[id].t : id));
const descendants = (id) => (kids[id] || []).reduce((a, k) => a + 1 + descendants(k), 0);

function card(id) {
  const n = byId[id], d = descendants(id);
  return `<a class="card ${n.cls || ""}" href="#${id}">
    <span class="k"><span>${esc(n.k)}</span>${n.code ? `<span class="code">${esc(n.code)}</span>` : ""}</span>
    <span class="t">${esc(n.t)}</span>
    <span class="s">${esc(plain(n.s))}</span>
    <span class="more">${d ? `Open · ${d} item${d > 1 ? "s" : ""} inside ›` : "Open ›"}</span></a>`;
}
function table(t) {
  return `<div class="tbl"><table>${t.cap ? `<caption>${esc(t.cap)}</caption>` : ""}
    <thead><tr>${t.cols.map(c => `<th scope="col">${esc(c)}</th>`).join("")}</tr></thead>
    <tbody>${t.rows.map(r => `<tr>${r.map((c, i) => `<td${t.cols[0] === "Field" && i === 0 ? ' class="mono"' : ""}>${linkify(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}

function renderHome() {
  const box = (id, sub) => `<a class="box" href="#${id}"><b>${esc(byId[id].t)}</b><span>${esc(sub)}</span></a>`;
  const step = (id, n, sub, cls) => `<a class="step ${cls || ""}" href="#${id}"><span class="n">${n}</span><b>${esc(byId[id].t)}</b><span>${esc(sub)}</span><em>${descendants(id)} details</em></a>`;
  const gov = (id, sub) => `<a href="#${id}"><b>${esc(byId[id].t)}</b><span>${esc(sub)}</span></a>`;
  return `
  <div class="eyebrow">Executive view <span class="lvl">Level 0</span></div>
  <h1>Global Risk Category Analytics</h1>
  <p class="lede">Turning thousands of safety reports into approved, traceable risk insight for SEWG. Every box opens; keep clicking to reach components, data fields and rules.</p>

    <div class="col src"><h4>Safety data</h4>
      ${box("src-public", "NTSB · FAA · NASA")}${box("src-internal", "protected, role-based")}${box("src-fleet", "flights and hours")}

    <div class="plat">
      <div class="plat-head"><a href="#platform">Secure analytics platform ›</a>

        ${step("step-categorize", 2, "AI suggests risk categories", "ai")}
        ${step("step-review", 3, "safety experts approve changes", "hu")}
        ${step("step-analyze", 4, "counts, rates, trends by category")}
      </div>
      <div class="loop"><a href="#loop">↺ expert decisions improve the AI</a></div>
    </div>
    <div class="col out"><h4>Outcomes</h4>
      ${box("o-3", "charts for SEWG")}${box("o-4", "counts, rates, trends")}${box("out-releases", "audit-ready")}
    </div>
  </div>
  <div class="gov"><h4>Governance foundation</h4>
    <div class="govrow">
      ${gov("gov-protect", "access by role")}${gov("gov-ai", "no data retention")}${gov("gov-humans", "nothing published unreviewed")}${gov("gov-trace", "every number to its reports")}${gov("gov-rhythm", "monthly data refresh")}
    </div>
  </div>
  <div class="legend">
    <span><i style="background:var(--navy)"></i>Automated step</span>
    <span><i style="background:var(--teal)"></i>AI-assisted</span>
    <span><i style="background:var(--green)"></i>Human decision</span>
    <span><i style="background:var(--amber)"></i>Governance</span>
  </div>
  <section class="blk"><h2>Also explore</h2>

  </section>`;
}

function renderNode(n) {
  const depth = pathTo(n.id).length - 1;
  const ch = kids[n.id] || [];
  let h = `<div class="eyebrow">${esc(n.k)} ${n.code ? `<span class="code">${esc(n.code)}</span>` : ""}<span class="lvl">Level ${depth}</span></div>
    <h1>${esc(n.t)}</h1><p class="lede">${linkify(n.s)}</p>`;
  if (n.facts) h += `<dl class="facts">${n.facts.map(([a, b]) => `<div class="fact"><dt>${esc(a)}</dt><dd>${linkify(b)}</dd></div>`).join("")}</dl>`;
  if (n.note) h += `<section class="blk"><div class="note">${linkify(n.note)}</div></section>`;
  if (ch.length) h += `<section class="blk"><h2>Go deeper <span>${ch.length} item${ch.length > 1 ? "s" : ""}</span></h2><div class="cards">${ch.map(card).join("")}</div></section>`;
  if (n.prose) h += `<section class="blk prose">${n.prose.map(p => `<p>${linkify(p)}</p>`).join("")}</section>`;
  if (n.tables) h += `<section class="blk"><h2>Detail</h2>${n.tables.map(table).join("")}</section>`;
  if (n.rel && n.rel.length) h += `<section class="blk"><h2>Related</h2><div class="chips">${n.rel.filter(r => byId[r]).map(r => `<a href="#${r}">${byId[r].code ? `<span class="code">${esc(byId[r].code)}</span>` : ""}${esc(byId[r].t)}</a>`).join("")}</div></section>`;
  if (n.links) h += `<section class="blk"><h2>Sources</h2><ul class="links">${n.links.map(([t, u]) => `<li><a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}</a></li>`).join("")}</ul></section>`;
  if (!ch.length) h += `<p class="hint" style="margin-top:28px">This is the deepest level for this item. Use the breadcrumb or the related links to keep exploring.</p>`;
  return h;
}

function renderTree(cur) {
  const open = new Set(pathTo(cur).map(n => n.id));
  const li = (id) => {
    const n = byId[id], c = kids[id] || [];
    const cls = id === cur ? "on" : (open.has(id) ? "anc" : "");
    return `<li><a class="${cls}" href="#${id}">${n.code ? n.code + " · " : ""}${esc(n.t)}</a>${c.length && open.has(id) ? `<ul>${c.map(li).join("")}</ul>` : ""}</li>`;
  };
  document.getElementById("tree").innerHTML = `<h3>System map</h3><ul>${li("home")}</ul>`;
  if (cur === "home") {
    document.getElementById("tree").innerHTML = `<h3>System map</h3><ul><li><a class="on" href="#home">Executive view</a><ul>${(kids.home || []).map(li).join("")}</ul></li></ul>`;
  }
}

function render() {
  let id = (location.hash || "#home").slice(1);
  if (!byId[id]) id = "home";
  const n = byId[id];
  document.getElementById("view").innerHTML = id === "home" ? renderHome() : renderNode(n);
  const path = pathTo(id);
  document.getElementById("crumbs").innerHTML = path.map((p, i) => i === path.length - 1
    ? `<span class="cur">${esc(i === 0 ? "Executive view" : p.t)}</span>`
    : `<a href="#${p.id}">${esc(i === 0 ? "Executive view" : p.t)}</a><span class="sep">›</span>`).join("");
  renderTree(id);
  document.getElementById("tree").classList.remove("open");
  document.getElementById("mapbtn").setAttribute("aria-expanded", "false");
  window.scrollTo({ top: 0 });
  document.title = id === "home" ? "Risk Category Analytics Explorer" : `${n.t} · Risk Category Analytics Explorer`;
}
window.addEventListener("hashchange", render);

/* search */
const q = document.getElementById("q"), res = document.getElementById("results");
const index = N.map(n => ({ id: n.id, hay: [n.t, n.k, n.code, plain(n.s), ...(n.tables || []).flatMap(t => t.rows.map(r => r.map(plain).join(" ")))].join(" ").toLowerCase() }));
let sel = 0, hits = [];
function search() {
  const term = q.value.trim().toLowerCase();
  if (term.length < 2) { res.hidden = true; return; }
  const words = term.split(/\s+/);
  hits = index.filter(x => words.every(w => x.hay.includes(w)))
    .sort((a, b) => (byId[b.id].t.toLowerCase().includes(term) - byId[a.id].t.toLowerCase().includes(term))).slice(0, 12);
  sel = 0;
  res.innerHTML = hits.length ? hits.map((x, i) => { const n = byId[x.id];
    return `<a href="#${n.id}" class="${i === 0 ? "on" : ""}">${n.code ? `<span class="code">${esc(n.code)}</span> ` : ""}${esc(n.t)}<small>${esc(n.k)} · ${esc(pathTo(n.id).slice(1, -1).map(p => p.t).join(" › ") || "Executive view")}</small></a>`; }).join("")
    : `<div class="hint" style="padding:8px 10px">No match. Try an ID like I-4, a field like event_id, or a word like rates.</div>`;
  res.hidden = false;
}
q.addEventListener("input", search);
q.addEventListener("keydown", (e) => {
  const links = [...res.querySelectorAll("a")];
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); if (!links.length) return;
    sel = (sel + (e.key === "ArrowDown" ? 1 : links.length - 1)) % links.length; links.forEach((l, i) => l.classList.toggle("on", i === sel)); }
  if (e.key === "Enter" && links[sel]) { location.hash = links[sel].getAttribute("href"); q.value = ""; res.hidden = true; }
  if (e.key === "Escape") { res.hidden = true; }
});
res.addEventListener("click", () => { q.value = ""; res.hidden = true; });
document.addEventListener("click", (e) => { if (!e.target.closest(".search")) res.hidden = true; });
document.getElementById("mapbtn").addEventListener("click", (e) => {
  const t = document.getElementById("tree"); const open = t.classList.toggle("open");
  e.currentTarget.setAttribute("aria-expanded", String(open));
});
render();
</script>

</body></html>
